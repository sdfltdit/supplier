name = "supplier"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Serves everything in /public (the form page, /admin panel, logo, favicons)
# as static assets. Any request that doesn't match a file in /public falls
# through to the Worker script above automatically — that's how /api/* and
# /health reach index.js without extra routing config.
[assets]
directory = "./public"
binding = "ASSETS"

# Used for rate limiting (replaces express-rate-limit, which relied on
# in-memory state that doesn't reliably persist across Worker isolates).
# Create it once with:
#   npx wrangler kv namespace create RATE_LIMIT_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b635d73886a24e5d9ca4872837e2a6a4"

# Non-secret vars. Real secrets (TURSO_AUTH_TOKEN, RESEND_API_KEY,
# ADMIN_API_KEY, TURSO_DATABASE_URL) must NOT go here — set those with:
#   npx wrangler secret put TURSO_AUTH_TOKEN
#   npx wrangler secret put TURSO_DATABASE_URL
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put ADMIN_API_KEY
# (or via the dashboard's Settings > Variables and secrets, which will
# now show up correctly since this Worker has real code, not just assets)

[vars]
ALLOWED_ORIGIN = "https://sdfltd.com"
RESEND_FROM_ADDRESS = "supplier@sdfltd.com"
RESEND_REPLY_TO_ADDRESS = "contact@sdfltd.com"
SUPPLIER_NOTIFY_EMAIL = "sdfltdit@gmail.com"

[observability]
enabled = true
